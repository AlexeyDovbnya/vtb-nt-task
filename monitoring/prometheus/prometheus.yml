global:
  scrape_interval: 5s          # как часто забирать метрики

scrape_configs:
  - job_name: kafka-stub
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
  - job_name: jmeter
    static_configs:
      - targets: [ "host.docker.internal:9270" ]